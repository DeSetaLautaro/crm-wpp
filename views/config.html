<h2>Configuración del Bot</h2>

<div class="config-card">
  <h3>Prompt principal</h3>
  <textarea id="prompt-ia" rows="8" placeholder="Escribí acá las instrucciones para tu bot..."></textarea>
  <p class="perfil-bienvenida-ayuda" style="margin-top:4px;">
    Podés usar <code>{menuTexto}</code>, <code>{historialTexto}</code>, <code>{nombreLocal}</code>, <code>{estadoLocal}</code>, <code>{mensajeCliente}</code>, <code>{horarios}</code> y <code>{atajos}</code> para insertar datos automáticos del local y la conversación.
  </p>
  <div style="display:flex; align-items:center; gap:12px; justify-content:space-between;">
    <label>
      <input type="checkbox" id="aplicar-prompt-todas">
      Aplicar a todas las líneas
    </label>
    <button type="button" id="btn-restaurar-prompt" class="btn-guardar-config" style="background:#6b7280;">Restaurar original</button>
  </div>
  <br><br>
  <button class="btn-guardar-config" id="btn-guardar-prompt">Guardar Prompt</button>
</div>

<div class="config-card">
  <h3>Atajos</h3>
  <div class="atajo-form">
    <div class="atajo-input-group">
      <input type="text" id="atajo-comando-input" placeholder="Comando (ej: horarios)">
    </div>
    <div class="atajo-input-group">
      <textarea id="atajo-respuesta-input" rows="2" placeholder="Respuesta (ej: Nuestro horario...)"></textarea>
    </div>
    <button id="atajo-agregar" type="button">+ Agregar</button>
  </div>
  <table class="atajos-tabla">
    <thead>
      <tr><th>Comando</th><th>Respuesta</th><th></th></tr>
    </thead>
    <tbody id="atajos-body"></tbody>
  </table>
  <br>
  <label class="checkbox-linea">
    <input type="checkbox" id="aplicar-atajos-todas">
    Aplicar a todas las líneas
  </label>
  <br><br>
</div>

<div class="config-card">
  <h3>Procesamiento de voz</h3>
  <label class="checkbox-linea">
    <input type="checkbox" id="procesar-audios">
    Activar transcripción de audios con IA
  </label>
  <br><br>
  <button class="btn-guardar-config" id="btn-guardar-audios">Guardar Audios</button>
</div>
