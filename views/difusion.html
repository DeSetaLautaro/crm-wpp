<h2>Difusiones</h2>

<div class="config-card">
  <h3>Nueva difusión</h3>
  <label>Mensaje</label>
  <textarea id="difusion-mensaje" rows="4" placeholder="Escribí el mensaje a difundir"></textarea>
  <label>Etiqueta (si la dejás vacía, se enviará a todos los contactos de la línea)</label>
  <input type="text" id="difusion-etiqueta" placeholder="Ej: VIP" />
  <button id="btn-crear-difusion" type="button" class="btn-guardar-config" style="margin-top:8px;">Crear difusión</button>
</div>

<div id="difusiones-lista" style="margin-top:12px;"></div>
