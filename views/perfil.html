<div id="config-perfil" class="config-panel">
  <!-- Perfil del Negocio -->
  <div class="perfil-edicion">
    <div class="perfil-foto-wrapper">
      <img id="perfil-foto-grande" src="" alt="Foto de perfil" class="perfil-foto-grande">
      <label for="config-foto" class="perfil-foto-cambiar" title="Cambiar foto">📷</label>
      <input type="file" id="config-foto" accept="image/*" style="display:none">
    </div>
    <div class="perfil-nombre-fila">
      <div class="perfil-campo">
        <label class="perfil-campo-label">Nombre</label>
        <span class="perfil-campo-valor" id="perfil-nombre-display">Mi Local</span>
      </div>
      <button class="perfil-campo-editar" id="btn-editar-nombre" title="Editar nombre">✏️</button>
    </div>
    <div class="perfil-nombre-fila">
      <div class="perfil-campo">
        <label class="perfil-campo-label">Estado</label>
        <span class="perfil-campo-valor" id="perfil-estado-display">Abierto hasta las 23hs</span>
      </div>
      <button class="perfil-campo-editar" id="btn-editar-estado" title="Editar estado">✏️</button>
    </div>
    <div class="perfil-nombre-fila">
      <div class="perfil-campo">
        <label class="perfil-campo-label">Mensaje de Bienvenida</label>
        <span class="perfil-campo-valor" id="perfil-bienvenida-display">¡Hola! Gracias por escribirnos, ¿en qué podemos ayudarte?</span>
      </div>
      <button class="perfil-campo-editar" id="btn-editar-bienvenida" title="Editar bienvenida">✏️</button>
    </div>
  </div>
</div>
